{% extends 'ifg_eventos/base.html' %}

{% block title %}
Evento | IFG-Eventos
{% endblock %}

{% block content %}
    

    <ul>
        <h2>{{event.name}}</h2>
        {% for register in registrations %}
            <p>{{ register.name }}</p>
        {% empty %}
            <p>Nenhuma inscrição feita ainda</p>
        {% endfor %}
    </ul>
    
{% endblock %}
