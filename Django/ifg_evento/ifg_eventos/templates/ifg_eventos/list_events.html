{% extends 'ifg_eventos/base.html' %}

{% block title %}
Lista de Eventos | IFG-Eventos
{% endblock %}

{% block content %}
    <ul>
        {% for event in event %}
            <div><a href="{% url 'event' event.id%}">{{ event.name }}</a></div>
            <form action="{% url 'register' event.id %}" method="post">
                {% csrf_token %}
                <button type="subimit">Registrar-se</button>
            </form>
            {% empty %}
                <p>Aqui ira listar todos os eventos disponiveis</p>
            {% endfor %}
    </ul>
    
{% endblock %}
